name: Deploy

# 推送到 main 自动部署；后台“系统升级”通过 workflow_dispatch 指定版本升级或回滚。
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 要部署的版本（main 或提交 SHA）
        required: false
        default: main

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install pytest
      - run: python -m pytest -q
      - run: for f in website/dist/*.js; do node --check "$f"; done

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Write VERSION.json
        run: |
          python3 - <<'EOF'
          import datetime, json, os, subprocess
          def log(fmt):
              return subprocess.check_output(["git", "log", "-1", f"--format={fmt}"], text=True).strip()
          version = {
              "commit": log("%H"), "message": log("%s"), "date": log("%cI"),
              "deployed_at": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
              "run_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }
          with open("VERSION.json", "w", encoding="utf-8") as f:
              json.dump(version, f, ensure_ascii=False, indent=2)
          print(version)
          EOF
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$HOST" && test -n "$DEPLOY_SSH_KEY" && test -n "$DEPLOY_KNOWN_HOSTS" || { echo "Missing deploy secrets"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Upload to staging
        run: rsync -az --delete --exclude-from=.deployignore -e "ssh -i $HOME/.ssh/deploy -o StrictHostKeyChecking=yes" ./ "root@$HOST:/opt/taptap-monitor/staging/"
      - name: Activate on server
        run: ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=yes "root@$HOST" 'sh /opt/taptap-monitor/staging/scripts/server-update.sh'
