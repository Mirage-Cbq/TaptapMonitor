services:
  monitor:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${MONITOR_PORT:-8080}:8080"
    environment:
      MONITOR_API_TOKEN: ${MONITOR_API_TOKEN:?Set MONITOR_API_TOKEN in .env}
      ASTRBOT_API_KEY: ${ASTRBOT_API_KEY:-}
      ASTRBOT_BASE_URL: ${ASTRBOT_BASE_URL:-}
    volumes:
      - monitor-data:/app/data
      - ./config.toml:/app/config.toml:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  monitor-data:
