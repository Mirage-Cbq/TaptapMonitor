# TaptapMonitor 反向代理：官网与管理后台都通过 80 端口对外提供。
# 后台与 API 需要管理令牌；/api/ 按来源 IP 限速以阻挡暴力尝试。
# 如只想公开官网、后台走 SSH 隧道，取消下方 “仅公开官网” 两行的注释。
# 有域名后建议启用 HTTPS（例如 certbot --nginx），令牌才不会以明文传输。

limit_req_zone $binary_remote_addr zone=taptap_api:10m rate=10r/s;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    client_max_body_size 10m;   # 厂商图标上传上限为 8 MB

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 仅公开官网：
    # location ^~ /api/ { return 404; }
    # location = /admin { return 404; }

    location ^~ /api/ {
        limit_req zone=taptap_api burst=40 nodelay;
        limit_req_status 429;
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_read_timeout 120s;
        proxy_pass http://127.0.0.1:8080;
    }

    location ~ ^/admin {
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_pass http://127.0.0.1:8080;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
    }
}
