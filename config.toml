[monitor]
database = "data/monitor.sqlite3"
poll_seconds = 1800
request_interval = 1.0
request_timeout = 30.0
max_pages = 100
collect_comments = true
cache_images = true

# Bootstrap entries are added only if absent. Existing subscriptions keep their settings.
[[developers]]
id = 383549
name = "菜篮子工作室"
logo = "/brand/studio-logo-transparent.png"

[digest]
# Set enabled=true and configure AstrBot + a subscription's target_umo to send.
enabled = false
interval_seconds = 86400
batch_size = 100

[astrbot]
base_url = ""
# API key comes from ASTRBOT_API_KEY, never from this file.

[upgrade]
# 后台“系统升级”通过此仓库的 GitHub Actions 部署流程更新服务器。
# 访问令牌来自环境变量 GITHUB_TOKEN（仓库级 fine-grained token：Actions 读写、Contents 只读）。
repo = "Mirage-Cbq/TaptapMonitor"
workflow = "deploy.yml"
branch = "main"

[site]
primary_developer_id = 383549

