<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="__PAGE_DESCRIPTION__">
  <meta property="og:title" content="__PAGE_TITLE__">
  <meta property="og:description" content="__PAGE_DESCRIPTION__">
  <meta property="og:image" content="__OG_IMAGE__">
  <meta name="theme-color" content="#f6f5ec">
  <title>__PAGE_TITLE__</title>
  <link rel="icon" href="__STUDIO_LOGO__">
  <link rel="stylesheet" href="/style.css">
  <script id="site-data" type="application/json">__SITE_DATA__</script>
  <script type="application/ld+json">__JSON_LD__</script>
  <script src="/site.js" defer></script>
</head>
<body>
  <a class="skip" href="#games">跳到游戏作品</a>
  <header class="header" id="header">
    <a class="brand" href="#top" aria-label="回到首页"><img data-studio-logo src="__STUDIO_LOGO__" width="40" height="40" loading="lazy" referrerpolicy="no-referrer" alt=""><span data-studio-name>__STUDIO_NAME__</span></a>
    <nav aria-label="主导航"><a href="#games">游戏作品</a><a href="#about">关于我们</a><a class="nav-cta" data-taptap target="_blank" rel="noopener noreferrer">TapTap 主页 <span aria-hidden="true">↗</span></a></nav>
  </header>

  <main id="top">
    <section class="hero" aria-labelledby="studio-title">
      <div class="hero-copy">
        <p class="pill entrance"><span class="pill-dot" aria-hidden="true"></span>独立游戏工作室</p>
        <h1 id="studio-title" class="entrance">__STUDIO_NAME__</h1>
        <p id="tagline" class="hero-tagline entrance">__STUDIO_TAGLINE__</p>
        <p id="studio-intro" class="hero-intro entrance"></p>
        <div class="hero-actions entrance">
          <a class="button" href="#games">浏览全部作品 <span aria-hidden="true">→</span></a>
          <a class="button ghost" data-taptap target="_blank" rel="noopener noreferrer">TapTap 主页 <span aria-hidden="true">↗</span></a>
        </div>
        <dl id="studio-stats" class="hero-stats entrance" aria-label="工作室数据"></dl>
      </div>
      <div class="hero-visual" aria-hidden="true">
        <div id="hero-fan" class="hero-fan"></div>
        <figure class="hero-badge"><img data-studio-logo class="hero-logo" src="__STUDIO_LOGO__" width="480" height="480" fetchpriority="high" decoding="async" referrerpolicy="no-referrer" alt=""></figure>
      </div>
    </section>

    <section id="spotlight" class="section spotlight reveal" aria-labelledby="spotlight-title" hidden>
      <div class="section-head"><div><p class="eyebrow">精选作品</p><h2 id="spotlight-title">先从这一款开始</h2></div></div>
      <article id="spotlight-card" class="spotlight-card"></article>
    </section>

    <section id="games" class="section works" aria-labelledby="games-title">
      <div class="section-head reveal">
        <div><p class="eyebrow">游戏作品</p><h2 id="games-title">来，选一个小世界</h2></div>
        <div id="filters" class="filters" role="group" aria-label="按类型筛选"></div>
      </div>
      <div id="game-list" class="game-grid" aria-live="polite"></div>
      <p id="empty" class="empty" hidden>作品正在准备中，过一会儿再来逛逛吧。</p>
    </section>

    <section id="about" class="section about reveal" aria-labelledby="about-title">
      <div class="about-card">
        <div><p class="eyebrow">关于工作室</p><h2 id="about-title">让好玩的想法，慢慢长大</h2></div>
        <div class="about-copy">
          <p id="about-copy"></p>
          <a class="text-link" data-taptap target="_blank" rel="noopener noreferrer">在 TapTap 认识我们 <span aria-hidden="true">↗</span></a>
        </div>
      </div>
    </section>

    <section class="section invitation reveal" aria-labelledby="invite-title">
      <div class="invite-card">
        <p class="eyebrow">游戏里见</p>
        <h2 id="invite-title">下一个好玩的瞬间，等你来发现</h2>
        <p>喜欢、建议，或是遇到的小问题，都欢迎在作品论坛告诉我们。</p>
        <a class="button light" data-taptap target="_blank" rel="noopener noreferrer">前往 TapTap <span aria-hidden="true">↗</span></a>
      </div>
    </section>
  </main>

  <footer class="footer">
    <a class="brand" href="#top"><img data-studio-logo src="__STUDIO_LOGO__" width="32" height="32" loading="lazy" referrerpolicy="no-referrer" alt=""><span data-studio-name></span></a>
    <p id="sync-note" class="sync-note"></p>
    <p>© <span id="year"></span> <span data-studio-name></span></p>
  </footer>

  <dialog id="game-dialog" aria-labelledby="dialog-title">
    <button class="dialog-close" aria-label="关闭游戏详情" autofocus>×</button>
    <img id="dialog-image" class="dialog-image" width="1920" height="1080" loading="lazy" referrerpolicy="no-referrer" alt="">
    <div class="dialog-body">
      <div id="dialog-tags" class="tag-row"></div>
      <h2 id="dialog-title"></h2>
      <div id="dialog-stats" class="stat-pills"></div>
      <section id="dialog-rating" class="rating-panel" aria-label="TapTap 评分"></section>
      <h3 class="detail-heading">游戏介绍</h3>
      <p id="dialog-description"></p>
      <div class="dialog-actions"><a id="dialog-play" class="button" target="_blank" rel="noopener noreferrer">前往 TapTap 下载 <span aria-hidden="true">↗</span></a><a id="dialog-forum" class="text-link" target="_blank" rel="noopener noreferrer">玩家论坛 ↗</a><button id="share-game" class="text-link" type="button">分享</button><p id="share-status" class="share-status" role="status"></p></div>
    </div>
  </dialog>
</body>
</html>
